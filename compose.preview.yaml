name: yandu
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: yandu
      POSTGRES_USER: yandu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yandu -d yandu"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  app:
    image: yandu:preview
    build:
      context: .
      dockerfile: Dockerfile.preview
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEMO_MODE: "false"
      SESSION_COOKIE_SECURE: "true"
      FORWARDED_ALLOW_IPS: "*"
      SITE_DOMAIN: ${SITE_DOMAIN:-39.106.45.65}
      DATABASE_URL: postgresql+psycopg://yandu:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/yandu
      ALLOWED_ORIGINS: https://${SITE_DOMAIN:-39.106.45.65}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/health',headers={'Host':os.environ.get('SITE_DOMAIN','39.106.45.65')}); urllib.request.urlopen(r,timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: yandu
      PGDATABASE: yandu
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: 14
    entrypoint: ["sh", "/usr/local/bin/backup_postgres.sh"]
    volumes:
      - ./scripts/backup_postgres.sh:/usr/local/bin/backup_postgres.sh:ro
      - ./data/backups/postgres:/backups
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  prometheus:
    image: prom/prometheus:latest
    container_name: yandu-prometheus
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: yandu-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  app_data:
  prometheus_data:
  grafana_data:
