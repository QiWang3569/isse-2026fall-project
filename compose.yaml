services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: yandu
      POSTGRES_USER: yandu
      POSTGRES_PASSWORD: yandu-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - yandu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yandu -d yandu"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  yandu-postgres:
